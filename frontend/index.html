<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NexIA — Assistant IA documentaire pour PME</title>
    <meta
      name="description"
      content="Importez vos PDF, posez vos questions en français, obtenez des réponses sourcées en quelques secondes."
    />
    <meta name="theme-color" content="#020617" />

    <!-- Aperçu des liens partagés (LinkedIn, Upwork, messageries). Sans ces
         balises, l'URL s'affiche nue : pas de titre, pas d'image, aucune
         crédibilité. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://assistant-pme-teal.vercel.app" />
    <meta property="og:title" content="NexIA — Assistant IA documentaire pour PME" />
    <meta
      property="og:description"
      content="Importez vos PDF, posez vos questions en français, obtenez des réponses sourcées en quelques secondes."
    />
    <!-- URL absolue obligatoire : les robots des réseaux sociaux ne résolvent
         pas les chemins relatifs et n'afficheraient aucune image. -->
    <meta
      property="og:image"
      content="https://assistant-pme-teal.vercel.app/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
